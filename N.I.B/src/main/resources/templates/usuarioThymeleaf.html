<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ranking de Usuários</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    .cabecalho {
      background-color: #0066ff;
      color: white;
      padding: 1rem 0;
      text-align: center;
    }

    .cabecalho__menu {
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    .cabecalho__menu__link {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .cabecalho__menu__link:hover {
      text-decoration: underline;
    }

    .titulo {
      color: #757575;
      font-size: 1.5em;
      margin-bottom: 10px;
      padding-bottom: 10px;
      text-align: center;
    }

    .style-tabela table {
      float: left;
      border: 1px solid #ccc;
      border-bottom: 0;
      border-right: 0;
      font-size: 0.9em;
      width: 100%;
    }

    .style-tabela table tr td {
      padding: 0.5em;
      border: 1px solid #ccc;
      border-top: 0;
      border-left: 0;
      text-align: center;
    }

    .style-tabela table td.top {
      background-color: #003EA6;
      color: #fff;
      font-size: 1em;
    }

    .style-tabela table td.top.center {
      text-align: center;
    }

    .style-tabela tbody tr {
      background-color: #fff;
      color: #333;
    }

    .style-tabela tbody tr:hover {
      background-color: #eef;
    }
  </style>
</head>
<body>
<header class="cabecalho">
  <nav class="cabecalho__menu">
    <a class="cabecalho__menu__link" href="/usuario">Usuários</a>
    <a class="cabecalho__menu__link" href="/consultas">Consultas</a>
    <a class="cabecalho__menu__link" href="/profissional">Profissionais</a>
    <a class="cabecalho__menu__link" href="/diarios">Registros diários dos usuários</a>
  </nav>
</header>

<h2 class="titulo">Ranking dos Usuários por Nota</h2>

<div th:if="${sucesso}" class="alert alert-success">
  <p th:text="${sucesso}"></p>
</div>
<div th:if="${erro}" class="alert alert-danger">
  <p th:text="${erro}"></p>
</div>

<div class="style-tabela">
  <table border="0" cellpadding="0" cellspacing="0">
    <thead>
    <tr>
      <td class="top center"><strong>Nota</strong></td>
      <td class="top center"><strong>Nome Completo</strong></td>
      <td class="top center"><strong>CPF</strong></td>
      <td class="top center"><strong>Email</strong></td>
      <td class="top center"><strong>Plano</strong></td>
      <td class="top center"><strong>Telefone</strong></td>
      <td class="top center"><strong>Data de Nascimento</strong></td>
      <td class="top center"><strong>Pontos</strong></td>
      <td class="top center"><strong>Sequência de Dias</strong></td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="usuario : ${usuarios}">
      <td th:text="${usuario.nota}"></td>
      <td th:text="${usuario.nomeUser + ' ' + usuario.sobrenomeUser}"></td>
      <td th:text="${usuario.cpfUser}"></td>
      <td th:text="${usuario.emailUser}"></td>
      <td th:text="${usuario.planoUser}"></td>
      <td th:text="${usuario.telefoneUser}"></td>
      <td th:text="${usuario.dataNascimentoUser}"></td>
      <td th:text="${usuario.pontos}"></td>
      <td th:text="${usuario.sequenciaDias}"></td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
