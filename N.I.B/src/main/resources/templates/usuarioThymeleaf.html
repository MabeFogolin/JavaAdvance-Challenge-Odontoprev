<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking de Usuários</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          background-color: #f4f4f4;
        }

        .cabecalho {
          background-color: #0066ff;
          color: white;
          padding: 1rem 0;
          text-align: center;
        }

        .cabecalho__menu {
          display: flex;
          justify-content: center;
          gap: 2rem;
        }

        .cabecalho__menu__link {
          color: white;
          text-decoration: none;
          font-weight: bold;
        }

        .cabecalho__menu__link:hover {
          text-decoration: underline;
        }

        .titulo {
          color: #333;
          font-size: 2em;
          margin: 1rem auto;
          text-align: center;
        }

        .cards-container {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
          padding: 1rem;
        }

        .card {
          background-color: white;
          border-radius: 10px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
          width: 300px;
          padding: 1rem;
          position: relative;
          transition: transform 0.2s;
          text-decoration: none;
          color: inherit;
          cursor: pointer;
        }

        .card:hover {
          transform: translateY(-5px);
        }

        .card h3 {
          margin: 0 0 0.5rem;
          color: #003EA6;
        }

        .card p {
          margin: 0.3rem 0;
          font-size: 0.95rem;
          color: #555;
        }

        /* Badge da nota */
        .badge {
          display: inline-block;
          padding: 0.4rem 0.8rem;
          border-radius: 5px;
          font-weight: bold;
          margin-bottom: 0.5rem;
          cursor: pointer;
          transition: transform 0.2s;
        }

        .badge:hover {
          transform: scale(1.05);
        }

        .badge.alta-nota {
          background-color: #003EA6;
          color: white;
        }

        .badge.baixa-nota {
          background-color: #ffcc00;
          color: #333;
        }

        /* Ícone de alerta (histórico) */
        .alerta-historico {
          position: absolute;
          top: 10px;
          right: 10px;
          width: 28px;
          height: 28px;
          background-color: red;
          color: white;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 16px;
          font-weight: bold;
          box-shadow: 0 2px 5px rgba(0,0,0,0.3);
          cursor: pointer;
        }

        .alerta-historico:hover::after {
          content: 'Enviar lembrete por e-mail';
          position: absolute;
          top: 36px;
          right: 0;
          background: #333;
          color: white;
          padding: 4px 8px;
          border-radius: 4px;
          font-size: 0.8rem;
          white-space: nowrap;
        }

        .mensagem-feedback {
          text-align: center;
          margin-top: 1rem;
          font-weight: bold;
        }

        .sucesso {
          color: green;
        }

        .erro {
          color: red;
        }
    </style>
</head>
<body>
<header class="cabecalho">
    <nav class="cabecalho__menu">
        <a class="cabecalho__menu__link" href="usuarioThymeleaf">Usuários</a>
    </nav>
</header>

<h2 class="titulo">Ranking dos Usuários</h2>

<div id="mensagem" class="mensagem-feedback"></div>

<div class="cards-container">
    <div class="card"
         th:each="usuario : ${usuarios}"
         th:attr="data-href=@{usuarioThymeleaf/{cpfUser}(cpfUser=${usuario.cpfUser})},
                  data-email=${usuario.emailUser},
                  data-nome=${usuario.nomeUser},
                  data-nota=${usuario.nota}"
         onclick="abrirPerfil(this)">

        <!-- Ícone de alerta clicável -->
        <div class="alerta-historico"
             th:if="${usuario.historico == null}"
             th:attr="data-email=${usuario.emailUser}, data-nome=${usuario.nomeUser}"
             onclick="event.stopPropagation(); enviarEmailHistorico(this)">!
        </div>

        <!-- Badge da nota -->
        <div th:class="'badge ' + (${usuario.nota} < 60 ? 'baixa-nota' : 'alta-nota')"
             th:text="'Nota: ' + ${usuario.nota} + '%'"
             th:attr="data-email=${usuario.emailUser}, data-nome=${usuario.nomeUser}, data-nota=${usuario.nota}"
             onclick="event.stopPropagation(); enviarEmailMelhorarNota(this)">
        </div>

        <h3 th:text="${usuario.nomeUser}"></h3>
        <p><strong>Email:</strong> <span th:text="${usuario.emailUser}"></span></p>
        <p><strong>Telefone:</strong> <span th:text="${usuario.telefoneUser}"></span></p>
        <p><strong>Nascimento:</strong> <span th:text="${usuario.dataNascimentoUser}"></span></p>
        <p><strong>Pontos:</strong> <span th:text="${usuario.pontos}"></span></p>
        <p><strong>Sequência de Dias:</strong> <span th:text="${usuario.sequenciaDias}"></span></p>
    </div>
</div>

<script>
    // Abre a página do usuário ao clicar no card
    function abrirPerfil(element) {
      const href = element.getAttribute('data-href');
      if (href) window.location.href = href;
    }

    // Envia e-mail de incentivo (ao clicar na nota)
    function enviarEmailMelhorarNota(element) {
      const nota = parseFloat(element.getAttribute('data-nota'));
      if (nota >= 60) return; // apenas notas baixas

      const email = element.getAttribute('data-email');
      const nome = element.getAttribute('data-nome');

      fetch('/email/sendMelhorarNota', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: email,
          name: nome,
          subject: 'Vamos melhorar sua nota?'
        })
      })
      .then(res => res.text())
      .then(msg => alert(msg))
      .catch(err => alert('Erro ao enviar o e-mail: ' + err));
    }

    // Envia e-mail do histórico (ícone vermelho)
    function enviarEmailHistorico(element) {
      event.stopPropagation();
      const email = element.getAttribute('data-email');
      const nome = element.getAttribute('data-nome');

      fetch('/email/sendHistorico', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: email,
          name: nome
        })
      })
      .then(res => res.text())
      .then(msg => alert(msg))
      .catch(err => alert('Erro ao enviar o e-mail: ' + err));
    }
</script>
</body>
</html>
