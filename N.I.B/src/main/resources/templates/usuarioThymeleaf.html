<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ranking de Usuários</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    .cabecalho {
      background-color: #0066ff;
      color: white;
      padding: 1rem 0;
      text-align: center;
    }

    .cabecalho__menu {
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    .cabecalho__menu__link {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .cabecalho__menu__link:hover {
      text-decoration: underline;
    }

    .titulo {
      color: #333;
      font-size: 2em;
      margin: 1rem auto;
      text-align: center;
    }

    .cards-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
      padding: 1rem;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin: 0 0 0.5rem;
      color: #003EA6;
    }

    .card p {
      margin: 0.3rem 0;
      font-size: 0.95rem;
      color: #555;
    }

    .card .badge {
      display: inline-block;
      background-color: #003EA6;
      color: white;
      padding: 0.3rem 0.6rem;
      border-radius: 5px;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
<header class="cabecalho">
  <nav class="cabecalho__menu">
    <a class="cabecalho__menu__link" href="/usuario">Usuários</a>
    <a class="cabecalho__menu__link" href="/consultas">Consultas</a>
    <a class="cabecalho__menu__link" href="/profissional">Profissionais</a>
    <a class="cabecalho__menu__link" href="/diarios">Registros diários dos usuários</a>
  </nav>
</header>

<h2 class="titulo">Ranking dos Usuários</h2>

<div th:if="${sucesso}" class="alert alert-success">
  <p th:text="${sucesso}"></p>
</div>
<div th:if="${erro}" class="alert alert-danger">
  <p th:text="${erro}"></p>
</div>

<div class="cards-container">
  <div class="card" th:each="usuario : ${usuarios}">
    <div class="badge" th:text="'Nota: ' + ${usuario.nota}"></div>
    <h3 th:text="${usuario.nomeUser + ' ' + usuario.sobrenomeUser}"></h3>
    <p><strong>CPF:</strong> <span th:text="${usuario.cpfUser}"></span></p>
    <p><strong>Email:</strong> <span th:text="${usuario.emailUser}"></span></p>
    <p><strong>Plano:</strong> <span th:text="${usuario.planoUser}"></span></p>
    <p><strong>Telefone:</strong> <span th:text="${usuario.telefoneUser}"></span></p>
    <p><strong>Nascimento:</strong> <span th:text="${usuario.dataNascimentoUser}"></span></p>
    <p><strong>Pontos:</strong> <span th:text="${usuario.pontos}"></span></p>
    <p><strong>Sequência de Dias:</strong> <span th:text="${usuario.sequenciaDias}"></span></p>
  </div>
</div>
</body>
</html>
