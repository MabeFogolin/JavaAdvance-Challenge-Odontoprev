<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Usuário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .cabecalho {
            background-color: #0066ff;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }

        .cabecalho__menu {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .cabecalho__menu__link {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .cabecalho__menu__link:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .titulo {
            color: #003EA6;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
            border-bottom: 2px solid #0066ff;
            padding-bottom: 0.5rem;
        }

        .info {
            display: flex;
            align-items: center;
            margin-bottom: 0.8rem;
            font-size: 1em;
            color: #333;
        }

        .info .icon {
            margin-right: 0.5rem;
            color: #0066ff;
            min-width: 25px;
        }

        .button {
            display: inline-block;
            background-color: #0066ff;
            color: white;
            padding: 0.6rem 1.2rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 1.5rem;
            text-align: center;
            transition: background 0.3s ease;
        }

        .button:hover {
            background-color: #0052cc;
        }
    </style>
</head>
<body>

<header class="cabecalho">
    <nav class="cabecalho__menu">
        <a class="cabecalho__menu__link" href="usuarioThymeleaf">Usuários</a>
    </nav>
</header>

<div class="container">
    <h2 class="titulo">Informações do Usuário</h2>

    <div class="info"><i class="fa fa-id-badge icon"></i><strong>CPF:</strong>&nbsp;<span th:text="${usuario.cpfUser}"></span></div>
    <div class="info"><i class="fa fa-user icon"></i><strong>Nome:</strong>&nbsp;<span th:text="${usuario.nomeUser + ' ' + usuario.sobrenomeUser}"></span></div>
    <div class="info"><i class="fa fa-calendar-alt icon"></i><strong>Data de Nascimento:</strong>&nbsp;<span th:text="${usuario.dataNascimentoUser}"></span></div>
    <div class="info"><i class="fa fa-envelope icon"></i><strong>E-mail:</strong>&nbsp;<span th:text="${usuario.emailUser}"></span></div>
    <div class="info"><i class="fa fa-phone icon"></i><strong>Telefone:</strong>&nbsp;<span th:text="${usuario.telefoneUser}"></span></div>
    <div class="info"><i class="fa fa-tags icon"></i><strong>Plano:</strong>&nbsp;<span th:text="${usuario.planoUser}"></span></div>
    <div class="info"><i class="fa fa-star icon"></i><strong>Nota:</strong>&nbsp;<span th:text="${usuario.nota}"></span></div>
    <div class="info"><i class="fa fa-trophy icon"></i><strong>Pontos:</strong>&nbsp;<span th:text="${usuario.pontos}"></span></div>
    <div class="info"><i class="fa fa-fire icon"></i><strong>Sequência de Dias:</strong>&nbsp;<span th:text="${usuario.sequenciaDias}"></span></div>

    <div th:if="${historico != null}">
        <h2 class="titulo">Histórico Médico</h2>

        <div class="info">
            <i class="fa fa-tooth icon"></i><strong>Tratamento:</strong>&nbsp;
            <span th:text="${historico.tratamentoHistorico}"></span>
        </div>

        <div class="info">
            <i class="fa fa-bacteria icon"></i><strong>Canal:</strong>&nbsp;
            <span th:text="${historico.canalHistorico}"></span>
        </div>

        <div class="info">
            <i class="fa fa-water icon"></i><strong>Limpeza:</strong>&nbsp;
            <span th:text="${historico.limpezaHistorico}"></span>
        </div>

        <div class="info">
            <i class="fa fa-bug icon"></i><strong>Cárie:</strong>&nbsp;
            <span th:text="${historico.carieHistorico}"></span>
        </div>

        <div class="info">
            <i class="fa fa-teeth-open icon"></i><strong>Ortodontia:</strong>&nbsp;
            <span th:text="${historico.ortodonticoHistorico}"></span>
        </div>

        <div class="info">
            <i class="fa fa-syringe icon"></i><strong>Cirurgia:</strong>&nbsp;
            <span th:text="${historico.cirurgiaHistorico}"></span>
        </div>
    </div>

    <div th:if="${historico == null}">
        <h3 class="titulo">Histórico Médico</h3>
        <p style="text-align:center; color:#777;">Nenhum histórico médico cadastrado para este usuário.</p>
    </div>

    <a href="usuarioThymeleaf" class="button">Voltar</a>

</div>

</body>
</html>
